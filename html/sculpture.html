<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Просмотр скульптуры — Музей Романа Фашаяна</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/sculpture.css" />
  </head>

  <body class="page-sculpture">
    <div id="preloader" class="preloader">
      <div class="preloader-inner">
        <div class="preloader-title">ПРОСМОТР СКУЛЬПТУРЫ</div>
        <div class="preloader-bar">
          <div class="preloader-bar-fill"></div>
        </div>
        <div class="preloader-perc" id="preloader-perc">0%</div>
      </div>
    </div>

    <header class="site-header">
      <div class="logo">МУЗЕЙ РОМАНА ФАШАЯНА</div>
      <nav class="main-nav">
        <a href="../index.html" class="nav-link">Главная</a>
        <a href="gallery.html" class="nav-link active">Галерея</a>
        <a href="sculptor.html" class="nav-link">Биография</a>
      </nav>
    </header>

    <button class="btn-outline" id="btn-back" type="button">
      Назад в галерею
    </button>

    <main>
      <section class="content-section sculpture-page">
        <div class="viewer-wrap">
          <div id="viewer" class="viewer"></div>

          <div class="viewer-error" id="viewer-error">
            Не удалось загрузить модель. Проверь путь к GLB в assets/ и имя
            файла.
          </div>
        </div>
      </section>
    </main>

    <div id="focus-mask" class="focus-mask" aria-hidden="true"></div>

    <div id="sculpture-info" class="sculpture-info" aria-hidden="true">
      <button id="info-toggle" class="info-toggle" type="button">
        Описание скульптуры
      </button>

      <div class="info-content">
        <h2 id="info-title" class="info-title">
          <span id="sc-title">Скульптура</span>
        </h2>
        <p id="info-text" class="info-text">
          <span id="sc-sub">— • — • 3D</span>
        </p>
      </div>
    </div>

    <div id="view-hints" class="view-hints" aria-hidden="true">
      <div class="view-hint-item">
        <span class="view-hint-icon" aria-hidden="true">⟲</span>
        <span class="view-hint-text">ЛКМ — вращение</span>
      </div>

      <div class="view-hint-item">
        <span class="view-hint-icon" aria-hidden="true">↕</span>
        <span class="view-hint-text">Колесо мыши — масштабирование</span>
      </div>
    </div>

    <script>
      document.getElementById("btn-back").addEventListener("click", (event) => {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.history.back();
      }, true);
    </script>
    <script type="module" src="../js/sculpture.js"></script>
  </body>
</html>

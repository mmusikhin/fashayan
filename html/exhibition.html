<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Защитникам Русской Земли — Музей Романа Фашаяна</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/exhibition.css" />
  </head>

  <body class="page-exhibition">
    <div id="preloader" class="preloader">
      <div class="preloader-inner">
        <div class="preloader-title">ЗАЩИТНИКАМ РУССКОЙ ЗЕМЛИ</div>
        <div class="preloader-bar">
          <div class="preloader-bar-fill"></div>
        </div>
        <div class="preloader-perc" id="preloader-perc">0%</div>
      </div>
    </div>

    <script>
      (() => {
        const preloader = document.getElementById("preloader");
        const fill = preloader?.querySelector(".preloader-bar-fill");
        const perc = document.getElementById("preloader-perc");

        if (!preloader || window.__EXHIBITION_PRELOADER__) return;

        let displayed = 0;
        const maxBeforeModule = 0.82;
        const startedAt = performance.now();

        function render(value) {
          displayed = Math.max(
            displayed,
            Math.max(0, Math.min(value, maxBeforeModule)),
          );

          const percent = Math.round(displayed * 100);

          if (fill) fill.style.width = `${percent}%`;
          if (perc) perc.textContent = `${percent}%`;
        }

        function tick() {
          const elapsed = performance.now() - startedAt;
          render(0.01 + elapsed * 0.000016);
        }

        const timerId = window.setInterval(tick, 120);
        render(0.01);

        window.__EXHIBITION_PRELOADER__ = {
          get value() {
            return displayed;
          },
          stop() {
            window.clearInterval(timerId);
          },
        };
      })();
    </script>

    <header class="site-header">
      <div class="logo">МУЗЕЙ РОМАНА ФАШАЯНА</div>
      <nav class="main-nav">
        <a href="../index.html" class="nav-link">Главная</a>
        <a href="gallery.html" class="nav-link">Галерея</a>
        <a href="sculptor.html" class="nav-link">Биография</a>
      </nav>
    </header>

    <button id="btn-exit-exhibition" class="btn-outline" type="button">
      Вернуться в галерею
    </button>

    <button id="btn-switch-hall" class="btn-outline" type="button">
      Следующий зал
    </button>

    <div id="exhibition-container"></div>

    <div id="focus-mask" class="focus-mask" aria-hidden="true"></div>

    <div id="sculpture-info" class="sculpture-info">
      <button id="info-toggle" class="info-toggle" type="button">
        Описание скульптуры
      </button>

      <div class="info-content">
        <h2 id="info-title" class="info-title"></h2>
        <p id="info-text" class="info-text"></p>
      </div>

      <button id="btn-exit-view" class="btn-outline" type="button">
        Назад к выставке
      </button>
    </div>

    <div id="view-hints" class="view-hints" aria-hidden="true">
      <div class="view-hint-item">
        <span class="view-hint-icon" aria-hidden="true">⟲</span>
        <span class="view-hint-text">ЛКМ — вращение</span>
      </div>

      <div class="view-hint-item">
        <span class="view-hint-icon" aria-hidden="true">↕</span>
        <span class="view-hint-text">Колесо мыши — масштабирование</span>
      </div>
    </div>

    <div id="mobile-gallery-controls" class="mobile-gallery-controls">
      <div class="mobile-gallery-hint">Нажмите на скульптуру для просмотра</div>

      <input
        id="gallery-look-slider"
        class="gallery-look-slider"
        type="range"
        min="-100"
        max="100"
        value="0"
        step="1"
        aria-label="Перемещение по выставке"
      />
    </div>

    <script type="module" src="../js/exhibition.js"></script>
  </body>
</html>
